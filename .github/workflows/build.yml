name: Build APK

# Every push to main builds a signed APK and publishes it as a GitHub Release.
# The app checks the latest Release and updates itself from it.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No signing key yet - building to check the code, but not publishing. Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets (Settings > Secrets and variables > Actions)."
            echo "HAS_KEY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "HAS_KEY=true" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish release
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          APK="DynamicIsland-v1.$N.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          git log -1 --pretty=%B > notes.txt
          gh release create "build-$N" "$APK" \
            --title "Dynamic Island v1.$N" \
            --notes-file notes.txt \
            --latest

      - name: Save build log if it failed
        if: failure()
        run: |
          mkdir -p /tmp/ci && (cp build.log /tmp/ci/build.log 2>/dev/null || echo "no log" > /tmp/ci/build.log)
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf . -q
          cp /tmp/ci/build.log build.log
          git add build.log
          git commit -q -m "Build log for run ${{ github.run_number }}"
          git push -f origin ci-logs
